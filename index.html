<!doctype html>
<html><head><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Retro Football</title>
<style>
*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden;background:#07140b;color:#fff;font-family:monospace}
#game{position:relative;height:100%;max-width:900px;margin:auto;background:#24732f}
canvas{width:100%;height:100%;display:block;image-rendering:pixelated}
.ui{position:absolute;inset:0;pointer-events:none}.top{display:flex;justify-content:space-between;padding:12px 15px;background:#06140ae8;font-size:16px;font-weight:bold}
#panel{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);background:#07140af2;border:4px solid #fff;padding:24px;text-align:center;min-width:270px;pointer-events:auto;box-shadow:8px 8px #000}
#panel h1{font-size:30px;margin:0 0 10px;color:#ffd84d}#panel p{line-height:1.5;color:#ddd}
button{font:inherit;font-weight:bold;background:#ffd84d;border:3px solid #111;padding:10px 18px;cursor:pointer}
#hint{position:absolute;bottom:10px;width:100%;text-align:center;font-size:12px;color:#d8f4d8;text-shadow:2px 2px #000}
.hidden{display:none!important}
</style></head><body><div id="game"><canvas id="c"></canvas>
<div class="ui"><div class="top"><span>🏈 RETRO FOOTBALL</span><span>TD <b id="td">0</b> | SCORE <b id="score">0</b></span></div>
<div id="panel"><h1>RETRO FOOTBALL</h1><p>Pick a receiver, throw the ball, then race to the end zone!</p><button id="start">KICK OFF</button></div>
<div id="hint">← → / A D to move • SPACE to throw • On mobile, tap a receiver</div></div></div>
<script>
const c=document.getElementById('c'),x=c.getContext('2d'),box=document.getElementById('game');
let W,H,d,player,receivers,defenders,ball,score=0,td=0,down=1,on=false,keys={},target=null,last;
function resize(){d=devicePixelRatio||1;W=box.clientWidth;H=box.clientHeight;c.width=W*d;c.height=H*d;x.setTransform(d,0,0,d,0,0)}addEventListener('resize',resize);resize();
function reset(){player={x:W*.2,y:H*.72};receivers=[{x:W*.48,y:H*.48,dx:.8},{x:W*.68,y:H*.35,dx:-.65}];defenders=[{x:W*.57,y:H*.6,dx:-.35},{x:W*.78,y:H*.42,dx:-.25}];ball=null;target=null;score=0;td=0;down=1}
function field(){x.fillStyle='#24732f';x.fillRect(0,0,W,H);x.fillStyle='#1d6127';for(let i=0;i<W;i+=80)x.fillRect(i,0,40,H);x.strokeStyle='#d8f4d8';x.lineWidth=2;for(let y=H*.15;y<H;y+=H*.1){x.beginPath();x.moveTo(0,y);x.lineTo(W,y);x.stroke()}x.fillStyle='#ffd84d';x.fillRect(W*.86,0,W*.14,H);x.fillStyle='#fff';x.font='bold 22px monospace';x.fillText('TD',W*.9,H*.08)}
function guy(p,col){x.fillStyle='#111';x.fillRect(p.x-9,p.y-13,18,26);x.fillStyle=col;x.fillRect(p.x-7,p.y-10,14,18);x.fillStyle='#f2c9a5';x.fillRect(p.x-5,p.y-19,10,8)}
function draw(){field();receivers.forEach((r,i)=>{guy(r,i===target? '#ffd84d':'#4ec9ff');x.fillStyle='#fff';x.font='12px monospace';x.fillText(i+1,r.x-4,r.y-25)});defenders.forEach(q=>guy(q,'#e84855'));guy(player,'#4ec9ff');if(ball){x.fillStyle='#8b4a1f';x.beginPath();x.ellipse(ball.x,ball.y,9,5,0,0,7);x.fill()}}
function over(msg){on=false;document.getElementById('panel').innerHTML='<h1>'+msg+'</h1><p>Touchdowns: '+td+'<br>Final score: '+score+'</p><button id="again">PLAY AGAIN</button>';document.getElementById('panel').classList.remove('hidden');document.getElementById('again').onclick=start}
function throwBall(){if(ball||!on)return;target=target===null?0:target;ball={x:player.x,y:player.y,tx:receivers[target].x,ty:receivers[target].y,t:0};}
function start(){reset();on=true;document.getElementById('panel').classList.add('hidden');last=performance.now();requestAnimationFrame(loop)}
function loop(t){if(!on)return;let dt=Math.min((t-last)/1000,.04);last=t;let dir=(keys.ArrowRight||keys.d?1:0)-(keys.ArrowLeft||keys.a?1:0);player.x=Math.max(25,Math.min(W*.83,player.x+dir*260*dt));
receivers.forEach((r,i)=>{r.x+=r.dx*75*dt;if(r.x<W*.35||r.x>W*.8)r.dx*=-1;r.y-=25*dt});
defenders.forEach(q=>{q.x+=q.dx*60*dt;q.y-=15*dt});
if(!ball){for(const q of defenders)if(Math.hypot(q.x-player.x,q.y-player.y)<25){over('TACKLED!');return}}
if(ball){ball.t+=dt*2.8;ball.x+=(ball.tx-ball.x)*dt*3;ball.y+=(ball.ty-ball.y)*dt*3;if(Math.hypot(ball.x-ball.tx,ball.y-ball.ty)<10){player.x=ball.x;player.y=ball.y;ball=null;target=null}}
else if(player.x>W*.82){td++;score+=7;over('TOUCHDOWN!');return}
else score=Math.max(score,td*7);
document.getElementById('td').textContent=td;document.getElementById('score').textContent=score;draw();requestAnimationFrame(loop)}
addEventListener('keydown',e=>{keys[e.key]=1;if(e.key===' ')throwBall();if(e.key==='1')target=0;if(e.key==='2')target=1});addEventListener('keyup',e=>keys[e.key]=0);
c.addEventListener('pointerdown',e=>{if(!on)return;let r=c.getBoundingClientRect(),mx=e.clientX-r.left,my=e.clientY-r.top;let n=receivers.map(q=>Math.hypot(q.x-mx,q.y-my));target=n[0]<n[1]?0:1;throwBall()});
document.getElementById('start').onclick=start;draw();
</script></body></html>
